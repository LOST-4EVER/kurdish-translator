<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1a"/>
      <stop offset="35%" stop-color="#191330"/>
      <stop offset="70%" stop-color="#28164a"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>

    <!-- Vibrant Ambient Glows -->
    <radialGradient id="coreGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sunGlow" cx="80%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Bevel & Surface Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1a35"/>
      <stop offset="50%" stop-color="#141024"/>
      <stop offset="100%" stop-color="#0d0a17"/>
    </linearGradient>

    <linearGradient id="screenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Translation Speed Stream -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Subtitle Bar Gradients -->
    <linearGradient id="subSource" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="subKurdish" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Glass Drop Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#7c5cfc" flood-opacity="0.35"/>
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Tile Base -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="118" fill="url(#coreGlow)"/>
  <rect width="512" height="512" rx="118" fill="url(#sunGlow)"/>

  <!-- Speed lines / CRT lines in background -->
  <path d="M 40 180 H 472 M 40 256 H 472 M 40 332 H 472" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2"/>

  <!-- Outer Ambient Glow behind Screen -->
  <ellipse cx="256" cy="268" rx="190" ry="140" fill="#a855f7" opacity="0.22" filter="url(#glowFilter)"/>

  <!-- Subtitle Screen / Video Display Unit -->
  <g filter="url(#dropShadow)">
    <rect x="76" y="96" width="360" height="308" rx="40" fill="url(#screenGrad)" stroke="url(#screenBorder)" stroke-width="4.5"/>
    
    <!-- Screen Inner Display -->
    <rect x="90" y="110" width="332" height="280" rx="30" fill="#08060f" fill-opacity="0.92"/>
    
    <!-- Top Status Bar: Rec dot & Badges -->
    <circle cx="122" cy="138" r="5.5" fill="#ef4444"/>
    <circle cx="122" cy="138" r="10" fill="#ef4444" fill-opacity="0.25"/>

    <rect x="142" y="126" width="60" height="24" rx="12" fill="#a855f7" fill-opacity="0.3" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="172" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#e9d5ff" text-anchor="middle" letter-spacing="0.8">LIVE</text>

    <!-- Kurdish Flag Sun / CKB Badge on Right -->
    <rect x="330" y="126" width="68" height="24" rx="12" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="364" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="0.8">CKB</text>

    <!-- Central Arena: Japanese/English (あ) ⇄ Kurdish (ک) Glyph Bridge -->
    <!-- Left Source Capsule: あ -->
    <g>
      <circle cx="152" cy="222" r="34" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
      <text x="152" y="236" font-family="'Noto Sans JP', 'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="900" fill="#38bdf8" text-anchor="middle" filter="url(#glowFilter)">あ</text>
    </g>

    <!-- Fast Particle Stream & Directional Chevron -->
    <g>
      <line x1="200" y1="222" x2="290" y2="222" stroke="url(#streamGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6"/>
      <polygon points="290,212 308,222 290,232" fill="#fbbf24" filter="url(#glowFilter)"/>
    </g>

    <!-- Right Target Capsule: ک -->
    <g>
      <circle cx="356" cy="222" r="34" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.6"/>
      <text x="356" y="238" font-family="'Noto Sans Arabic', 'Noto Naskh Arabic', system-ui, sans-serif" font-size="44" font-weight="900" fill="#fbbf24" text-anchor="middle" filter="url(#glowFilter)">ک</text>
    </g>

    <!-- Subtitle Bar Container (Glass Pill at Bottom) -->
    <rect x="114" y="292" width="284" height="74" rx="20" fill="#0c0a17" fill-opacity="0.9" stroke="#f472b6" stroke-width="1.8" stroke-opacity="0.5"/>

    <!-- Track 1: Original Dialogue Lines -->
    <rect x="136" y="308" width="100" height="13" rx="6.5" fill="url(#subSource)"/>
    <rect x="246" y="308" width="132" height="13" rx="6.5" fill="url(#subSource)"/>

    <!-- Track 2: Kurdish Sorani Karaoke Glow Line -->
    <g filter="url(#glowFilter)">
      <rect x="136" y="332" width="156" height="17" rx="8.5" fill="url(#subKurdish)"/>
      <rect x="302" y="332" width="76" height="17" rx="8.5" fill="url(#subKurdish)"/>
    </g>
  </g>

  <!-- Kurdish 21-Ray Sun & Radiant Star Accent at Top Right -->
  <g filter="url(#sparkleGlow)">
    <path d="M 432 64 Q 432 88 456 88 Q 432 88 432 112 Q 432 88 408 88 Q 432 88 432 64 Z" fill="#fbbf24"/>
    <circle cx="432" cy="88" r="4.5" fill="#ffffff"/>
  </g>

  <!-- Mini Sparkle at Bottom Left -->
  <g filter="url(#sparkleGlow)">
    <path d="M 72 416 Q 72 430 86 430 Q 72 430 72 444 Q 72 430 58 430 Q 72 430 72 416 Z" fill="#38bdf8"/>
  </g>
</svg>
